
name: Build fgetpriority Kernel Module

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: Kernel source repository
        required: true
        default: https://github.com/NKRLabs/kernel_xiaomi_sm8250_mod

      kernel_ref:
        description: Kernel branch or tag
        required: true
        default: android15-lineage22-mod

      defconfig:
        description: Target device defconfig
        required: true
        default: munch_defconfig

      kernel_localversion:
        description: Exact LOCALVERSION suffix (empty = build.sh convention)
        required: false
        default: ""

      upload_release:
        description: Upload to GitHub Release
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 LKM
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout fgetpriority
        uses: actions/checkout@v4
        with:
          path: fgetpriority

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            unzip \
            zip \
            bc \
            bison \
            flex \
            cpio \
            rsync \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            kmod

      - name: Download Proton Clang
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/proton-clang"

          wget -q \
            https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip \
            -O "$HOME/proton-clang/compiler.zip"

          unzip -q \
            "$HOME/proton-clang/compiler.zip" \
            -d "$HOME/proton-clang"

          TOOLCHAIN="$HOME/proton-clang/proton-clang-20210522"

          test -x "$TOOLCHAIN/bin/clang"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          clang --version || "$TOOLCHAIN/bin/clang" --version

      - name: Clone kernel source
        shell: bash
        env:
          KERNEL_URL: ${{ inputs.kernel_url }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "$KERNEL_REF" \
            "$KERNEL_URL" \
            kernelsrc

          cd kernelsrc

          echo "Kernel branch: $KERNEL_REF"
          echo "Kernel commit: $(git rev-parse HEAD)"

          echo "KERNEL_COMMIT=$(git rev-parse --short=8 HEAD)" \
            >> "$GITHUB_ENV"

      - name: Configure kernel
        shell: bash
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          REQUESTED_LOCALVERSION: ${{ inputs.kernel_localversion }}
        run: |
          set -euo pipefail

          cd kernelsrc

          DEFCONFIG="$(basename "$DEFCONFIG")"

          if [[ ! -f "arch/arm64/configs/$DEFCONFIG" ]]; then
            echo "ERROR: Defconfig not found: $DEFCONFIG"
            exit 1
          fi

          MAKE_ARGS=(
            ARCH=arm64
            SUBARCH=arm64
            O=out
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
          )

          make "${MAKE_ARGS[@]}" "$DEFCONFIG"

          # Match the kernel repository's build.sh localversion convention.
          if [[ -n "$REQUESTED_LOCALVERSION" ]]; then
            LOCALVERSION="$REQUESTED_LOCALVERSION"
          else
            LOCALVERSION="-$(date +%Y%m%d)-${KERNEL_COMMIT}-perf"
          fi

          ./scripts/config \
            --file out/.config \
            --set-str LOCALVERSION "$LOCALVERSION" \
            --disable LOCALVERSION_AUTO

          make "${MAKE_ARGS[@]}" olddefconfig

          # Verify module support.
          grep -q '^CONFIG_MODULES=y$' out/.config

          grep -q '^CONFIG_MODVERSIONS=y$' out/.config

          echo "Kernel LOCALVERSION: $LOCALVERSION"

          echo "MAKE_ARGS=${MAKE_ARGS[*]}" >> "$GITHUB_ENV"

      - name: Build kernel and generate Module.symvers
        shell: bash
        run: |
          set -euo pipefail

          cd kernelsrc

          MAKE_ARGS=(
            ARCH=arm64
            SUBARCH=arm64
            O=out
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
          )

          # Full kernel build is necessary for MODVERSIONS.
          make "${MAKE_ARGS[@]}" \
            -j"$(nproc)" \
            Image dtbs modules

          # modules_prepare alone does not generate this file.
          if [[ ! -s out/Module.symvers ]]; then
            echo "ERROR: Module.symvers was not generated!"
            exit 1
          fi

          echo "Module.symvers generated:"
          ls -lh out/Module.symvers

      - name: Build external fgetpriority module
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/kernelsrc"
          MODULE_SRC="$GITHUB_WORKSPACE/fgetpriority/kernel"
          OUT_DIR="$KERNEL_DIR/out"

          cd "$KERNEL_DIR"

          MAKE_ARGS=(
            ARCH=arm64
            SUBARCH=arm64
            O=out
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
          )

          # Explicitly build the external module.
          make "${MAKE_ARGS[@]}" \
            M="$MODULE_SRC" \
            CONFIG_FGETPRIORITY=m \
            modules -j"$(nproc)"

          shopt -s nullglob

          KOS=("$MODULE_SRC"/*.ko)

          if [[ ${#KOS[@]} -eq 0 ]]; then
            echo "ERROR: No .ko file was generated!"
            exit 1
          fi

          aarch64-linux-gnu-strip --strip-debug "${KOS[@]}"

          echo "Generated modules:"
          ls -lh "${KOS[@]}"

      - name: Verify kernel module
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          KO="$GITHUB_WORKSPACE/fgetpriority/kernel/fgetpriority.ko"

          if [[ ! -s "$KO" ]]; then
            echo "ERROR: fgetpriority.ko does not exist!"
            exit 1
          fi

          echo "=== ELF information ==="
          file "$KO"

          echo ""
          echo "=== Module information ==="
          modinfo "$KO"

          VERMAGIC="$(modinfo -F vermagic "$KO")"
          KREL="${VERMAGIC%% *}"

          echo ""
          echo "Kernel release: $KREL"
          echo "Vermagic: $VERMAGIC"

          if [[ -z "$VERMAGIC" ]]; then
            echo "ERROR: Missing vermagic!"
            exit 1
          fi

          echo "KREL=$KREL" >> "$GITHUB_OUTPUT"
          echo "VERMAGIC=$VERMAGIC" >> "$GITHUB_OUTPUT"

      - name: Package module
        id: package
        shell: bash
        env:
          KREL: ${{ steps.verify.outputs.KREL }}
        run: |
          set -euo pipefail

          mkdir -p dist

          KO="$GITHUB_WORKSPACE/fgetpriority/kernel/fgetpriority.ko"

          ZIPNAME="${KREL}-fgetpriority-kernel-module.zip"

          zip -9 -j "dist/$ZIPNAME" "$KO"

          cp "$KO" dist/

          cat > dist/build-info.txt <<EOF
          Module: fgetpriority
          Architecture: arm64
          Kernel release: $KREL
          Kernel repository: ${{ inputs.kernel_url }}
          Kernel branch: ${{ inputs.kernel_ref }}
          Kernel commit: $KERNEL_COMMIT
          Defconfig: ${{ inputs.defconfig }}
          Compiler: Proton Clang 20210522
          EOF

          echo "zipname=$ZIPNAME" >> "$GITHUB_OUTPUT"

          echo "=== Package contents ==="
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fgetpriority-${{ steps.verify.outputs.KREL }}
          path: |
            dist/*.ko
            dist/*.zip
            dist/build-info.txt
          if-no-files-found: error
          compression-level: 9

      - name: Generate release notes
        shell: bash
        env:
          KREL: ${{ steps.verify.outputs.KREL }}
          VERMAGIC: ${{ steps.verify.outputs.VERMAGIC }}
        run: |
          set -euo pipefail

          cat > dist/release_notes.md <<EOF
          ## fgetpriority Kernel Module

          - Architecture: ARM64
          - Kernel release: $KREL
          - Vermagic: $VERMAGIC
          - Kernel branch: ${{ inputs.kernel_ref }}
          - Kernel commit: $KERNEL_COMMIT
          - Defconfig: ${{ inputs.defconfig }}
          - Compiler: Proton Clang 20210522

          ### Files

          - fgetpriority.ko
          - ${{ steps.package.outputs.zipname }}

          Build generated against the specified kernel source and defconfig.
          EOF

      - name: Publish GitHub Release
        if: inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.KREL }}
          name: fgetpriority - ${{ steps.verify.outputs.KREL }}
          body_path: dist/release_notes.md
          files: |
            dist/fgetpriority.ko
            dist/${{ steps.package.outputs.zipname }}
            dist/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
