
name: Build fgetpriority Kernel Module

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: "Kernel Source Git URL"
        required: true
        default: "https://github.com/NKRLabs/kernel_xiaomi_sm8250_mod"

      kernel_ref:
        description: "Branch / tag / commit (optional)"
        required: false
        default: "android15-lineage22-mod"

      defconfig:
        description: "Defconfig name (e.g. munch_defconfig)"
        required: true
        default: "munch_defconfig"

      disable_modversions:
        description: "Disable MODVERSIONS via scripts/config"
        required: false
        default: false
        type: boolean

      upload_release:
        description: "Upload ZIP to GitHub Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # --------------------------------------------------
    # Checkout fgetpriority repository
    # --------------------------------------------------

    - uses: actions/checkout@v4

    # --------------------------------------------------
    # Install dependencies
    # --------------------------------------------------

    - name: Install tools
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          libelf-dev \
          bc \
          bison \
          flex \
          libssl-dev \
          zip \
          kmod \
          jq

    # --------------------------------------------------
    # Download kernel source
    # --------------------------------------------------

    - name: Download kernel
      shell: bash
      run: |
        set -euxo pipefail

        rm -rf kernelsrc

        KERNEL_URL="${{ inputs.kernel_url }}"
        KERNEL_REF="${{ inputs.kernel_ref }}"

        echo "Requested kernel_url: $KERNEL_URL"
        echo "Requested kernel_ref: '$KERNEL_REF'"

        if [ -z "$KERNEL_REF" ]; then

          git clone \
            --depth=1 \
            --recurse-submodules \
            --shallow-submodules \
            "$KERNEL_URL" kernelsrc

          cd kernelsrc

        else

          if git ls-remote --heads --tags \
              "$KERNEL_URL" "$KERNEL_REF" | grep -q .; then

            git clone \
              --depth=1 \
              --branch "$KERNEL_REF" \
              --recurse-submodules \
              --shallow-submodules \
              "$KERNEL_URL" kernelsrc

            cd kernelsrc

          else

            git clone "$KERNEL_URL" kernelsrc

            cd kernelsrc

            git checkout "$KERNEL_REF"

            git submodule update --init --recursive

          fi

        fi

        echo "Kernel branch: $(git branch --show-current || echo '(detached or unknown)')"
        echo "Kernel commit: $(git rev-parse --short HEAD)"

    # --------------------------------------------------
    # Configure kernel
    # --------------------------------------------------

    - name: Configure kernel
      shell: bash
      run: |
        set -euxo pipefail

        cd kernelsrc

        DEFCONFIG_INPUT="${{ inputs.defconfig }}"
        DEFCONFIG_NAME="$(basename "$DEFCONFIG_INPUT")"

        test -f "arch/arm64/configs/$DEFCONFIG_NAME"

        MAKE_ARGS=(
          ARCH=arm64
          CROSS_COMPILE=aarch64-linux-gnu-
        )

        # Set kernel local version.
        ./scripts/config \
          --set-str LOCALVERSION "4.19.325-perf+" \
          --disable LOCALVERSION_AUTO

        # Generate configuration.
        make "${MAKE_ARGS[@]}" "$DEFCONFIG_NAME"

        # Enable required options.
        ./scripts/config --enable CONFIG_MODULES
        ./scripts/config --enable CONFIG_KPROBES
        ./scripts/config --enable CONFIG_KRETPROBES

        # Optional MODVERSIONS configuration.
        if [[ "${{ inputs.disable_modversions }}" == "true" ]]; then

          ./scripts/config --disable CONFIG_MODVERSIONS
          ./scripts/config --disable CONFIG_ASM_MODVERSIONS
          ./scripts/config --disable CONFIG_MODULE_SRCVERSION_ALL

        fi

        make "${MAKE_ARGS[@]}" olddefconfig

        echo "=== Kernel configuration ==="

        grep -E \
          'CONFIG_MODULES=|CONFIG_MODVERSIONS=|CONFIG_KPROBES=|CONFIG_KRETPROBES=' \
          .config || true

        grep -q '^CONFIG_MODULES=y$' .config

        # Prepare kernel headers.
        make "${MAKE_ARGS[@]}" modules_prepare -j"$(nproc)"

    # --------------------------------------------------
    # Build fgetpriority external module
    # --------------------------------------------------

    - name: Build module
      shell: bash
      run: |
        set -euxo pipefail

        KERNEL_DIR="$(pwd)/kernelsrc"
        MODULE_SRC="$(pwd)/kernel"

        if [[ ! -f "$MODULE_SRC/Makefile" ]]; then
          echo "ERROR: kernel/Makefile not found!"
          exit 1
        fi

        cd "$KERNEL_DIR"

        make -C "$KERNEL_DIR" \
          M="$MODULE_SRC" \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CONFIG_FGETPRIORITY=m \
          modules -j"$(nproc)"

        # Verify generated module before stripping.
        shopt -s nullglob

        KOS=("$MODULE_SRC"/*.ko)

        if [ ${#KOS[@]} -eq 0 ]; then
          echo "ERROR: No .ko generated!"
          exit 1
        fi

        # Strip debug symbols.
        aarch64-linux-gnu-strip \
          --strip-debug "${KOS[@]}"

        echo "Generated modules:"
        ls -lh "${KOS[@]}"

    # --------------------------------------------------
    # Verify build
    # --------------------------------------------------

    - name: Verify build
      shell: bash
      run: |
        set -euxo pipefail

        shopt -s nullglob

        KOS=(kernel/*.ko)

        if [ ${#KOS[@]} -eq 0 ]; then
          echo "ERROR: No kernel module found!"
          exit 1
        fi

        echo "=== ELF information ==="

        file "${KOS[@]}"

        echo ""
        echo "=== Module information ==="

        modinfo "${KOS[@]}"

        echo ""
        echo "SUCCESS: Module compiled!"

    # --------------------------------------------------
    # Package module using vermagic
    # --------------------------------------------------

    - name: Package kernel module
      id: package
      shell: bash
      run: |
        set -euxo pipefail

        shopt -s nullglob

        KOS=(kernel/*.ko)

        if [ ${#KOS[@]} -eq 0 ]; then
          echo "No .ko built, skipping packaging."
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        KO="${KOS[0]}"

        VERMAGIC="$(modinfo -F vermagic "$KO" | tr -d '\n')"

        echo "vermagic: $VERMAGIC"

        KREL="$(echo "$VERMAGIC" | awk '{print $1}')"

        MODNAME="fgetpriority"

        ZIPNAME="${KREL}-${MODNAME}-kernel-driver.zip"

        mkdir -p dist

        rm -f "dist/$ZIPNAME"

        # Include all generated .ko files.
        (cd kernel && zip -9 "../dist/$ZIPNAME" ./*.ko)

        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "tag_name=$KREL" >> "$GITHUB_OUTPUT"
        echo "zipname=$ZIPNAME" >> "$GITHUB_OUTPUT"
        echo "zippath=dist/$ZIPNAME" >> "$GITHUB_OUTPUT"

    # --------------------------------------------------
    # Upload .ko as artifact
    # --------------------------------------------------

    - name: Upload .ko as artifact
      if: steps.package.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: fgetpriority-kernel-driver
        path: kernel/*.ko

    # --------------------------------------------------
    # Generate release notes
    # --------------------------------------------------

    - name: Generate release notes
      if: steps.package.outputs.found == 'true'
      shell: bash
      run: |
        set -euxo pipefail

        mkdir -p dist

        {
          echo "### Build sources"
          echo ""

          echo "- Kernel source URL: ${{ inputs.kernel_url }}"

          if [[ -n "${{ inputs.kernel_ref }}" ]]; then
            echo "- Kernel ref: ${{ inputs.kernel_ref }}"
          fi

          echo "- Defconfig: ${{ inputs.defconfig }}"

          echo ""
          echo "### Module information"
          echo ""

          echo '```'
          modinfo kernel/*.ko
          echo '```'

        } > dist/release_notes.md

    # --------------------------------------------------
    # Upload ZIP to GitHub Release
    # --------------------------------------------------

    - name: Upload ZIP to GitHub Release
      if: steps.package.outputs.found == 'true' && inputs.upload_release == 'true'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.package.outputs.tag_name }}
        name: ${{ steps.package.outputs.tag_name }}
        files: ${{ steps.package.outputs.zippath }}
        body_path: dist/release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
